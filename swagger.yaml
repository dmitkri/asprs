components:
  securitySchemes:
    sessionAuth:
      type: apiKey
      in: cookie
      name: session
      description: Сессионная аутентификация через Flask session cookie
    hmacAuth:
      type: apiKey
      in: header
      name: X-API-Token
      description: |
        HMAC-SHA256 токен. Вычисляется как:
        HMAC-SHA256(API_SECRET_KEY, timestamp + path + method)
      x-otherHeaders:
        X-Timestamp: Unix timestamp запроса

  schemas:
    Employee:
      type: object
      properties:
        id:
          type: integer
        fio:
          type: string
          description: ФИО студента
        phone:
          type: string
        group_name:
          type: string
        birth_date:
          type: string
          format: date
        building:
          type: string
        entrance:
          type: string
        room_number:
          type: string
        vacation:
          type: string
        vacation_history:
          type: array
          items:
            type: string
        extra_data:
          type: object
          additionalProperties: true
        representatives:
          type: array
          items:
            type: object
        education_level:
          type: string
        notes:
          type: string
        photo:
          type: string

    EmployeeInput:
      type: object
      properties:
        fio:
          type: string
        phone:
          type: string
        group_name:
          type: string
        birth_date:
          type: string
          format: date
        building:
          type: string
        entrance:
          type: string
        room_number:
          type: string
        education_level:
          type: string
        notes:
          type: string
        extra_data:
          type: object
          additionalProperties: true

    Admin:
      type: object
      properties:
        id:
          type: integer
        username:
          type: string
        role:
          type: string
        is_active:
          type: boolean
