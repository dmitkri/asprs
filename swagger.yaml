openapi: 3.0.3
info:
  title: Audit System API
  description: |
    API для системы управления студентами, проживанием, оплатами, мероприятиями и другими функциями.
    
    ## Аутентификация
    
    ### Административные API
    Большинство административных API требуют сессионной аутентификации через Flask session.
    После входа через `/admin` устанавливается сессия с `admin_id`.
    
    ### Студенческие API
    Студенческие API (`/api/student/*`) используют HMAC-аутентификацию:
    - Заголовок `X-API-Token`: HMAC-SHA256 токен
    - Заголовок `X-Timestamp`: Unix timestamp запроса
    - Токен вычисляется как: `HMAC-SHA256(API_SECRET_KEY, timestamp + path + method)`
    
    ## Права доступа
    
    Система использует систему прав доступа (permissions):
    - `view` - Просмотр данных
    - `edit` - Редактирование
    - `delete` - Удаление
    - `import` - Импорт данных
    - `manage_columns` - Управление колонками
    - `manage_health` - Управление здоровьем
    - `manage_vacation` - Управление отпусками
    - `manage_admins` - Управление администраторами
    - `manage_bed_linen` - Управление постельным бельем
    - `manage_send_messages` - Отправка сообщений
    - `view_reports` - Просмотр отчетов
    - `manage_tg_users` - Управление Telegram пользователями
    - `scan_qr` - Сканирование QR-кодов
    - `manage_payments` - Управление оплатами
    - `manage_rooms` - Управление комнатами
    - `manage_minors` - Управление несовершеннолетними
    - `manage_round_assignments` - Управление назначениями обходов
    - `manage_events` - Управление мероприятиями
    - `access_college` - Доступ к колледжу
    - `all` - Все права
  version: 1.0.0
  contact:
    name: API Support

servers:
  - url: http://localhost:5003
    description: Локальный сервер разработки
  - url: https://api.example.com
    description: Production сервер

tags:
  - name: Authentication
    description: Аутентификация и авторизация
  - name: Employees
    description: Управление студентами (employees)
  - name: Admin
    description: Управление администраторами и ролями
  - name: Rooms
    description: Управление комнатами
  - name: Payments
    description: Управление оплатами
  - name: Events
    description: Управление мероприятиями
  - name: Student API
    description: API для студентов
  - name: Bed Linen
    description: Управление постельным бельем
  - name: Rounds
    description: Обходы и назначения
  - name: Maintenance
    description: Заявки на обслуживание
  - name: Groups
    description: Управление группами
  - name: Backup
    description: Резервное копирование
  - name: Import/Export
    description: Импорт и экспорт данных
  - name: Utilities
    description: Вспомогательные функции

paths:
  # ==================== Authentication ====================
  /admin:
    get:
      tags: [Authentication]
      summary: Страница входа администратора
      description: Отображает форму входа для администраторов
      responses:
        '200':
          description: Форма входа
    post:
      tags: [Authentication]
      summary: Вход администратора
      description: Аутентификация администратора и создание сессии
      requestBody:
        required: true
        content:
          application/x-www-form-urlencoded:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                  description: Имя пользователя
                password:
                  type: string
                  format: password
                  description: Пароль
      responses:
        '302':
          description: Успешный вход, редирект на панель администратора
        '200':
          description: Ошибка входа, отображается форма с сообщением об ошибке

  /logout:
    get:
      tags: [Authentication]
      summary: Выход из системы
      description: Завершает сессию администратора
      responses:
        '302':
          description: Редирект на главную страницу

  /api/user:
    get:
      tags: [Authentication]
      summary: Получить информацию о текущем пользователе
      description: Возвращает информацию о текущем авторизованном администраторе
      responses:
        '200':
          description: Информация о пользователе
          content:
            application/json:
              schema:
                type: object
                properties:
                  is_admin:
                    type: boolean
                  admin_id:
                    type: integer
                  admin_username:
                    type: string
                  admin_role:
                    type: string
                  admin_fio:
                    type: string

  /api/admin/permissions:
    get:
      tags: [Authentication]
      summary: Получить права доступа текущего администратора
      description: Возвращает список всех прав доступа и их значения для текущего администратора
      responses:
        '200':
          description: Права доступа
          content:
            application/json:
              schema:
                type: object
                properties:
                  permissions:
                    type: object
                    additionalProperties:
                      type: boolean
                  role:
                    type: string

  # ==================== Employees ====================
  /api/columns:
    get:
      tags: [Employees]
      summary: Получить список колонок
      description: Возвращает список фиксированных и пользовательских колонок для отображения данных студентов
      responses:
        '200':
          description: Список колонок
          content:
            application/json:
              schema:
                type: object
                properties:
                  fixed:
                    type: array
                    items:
                      type: string
                    description: Фиксированные колонки (fio, phone, group_name, birth_date)
                  custom:
                    type: array
                    items:
                      type: object
                      properties:
                        name:
                          type: string
                        col_type:
                          type: string

  /api/employees:
    get:
      tags: [Employees]
      summary: Получить список студентов
      description: |
        Получить список студентов с возможностью фильтрации.
        Поддерживает фильтрацию по поисковому запросу, группе и статусу.
        Автоматически применяет ограничения доступа на основе уровня образования администратора.
      parameters:
        - name: q
          in: query
          description: Поисковый запрос. Ищет по ФИО, телефону, группе, заметкам, отпускам и т.д.
          schema:
            type: string
        - name: group
          in: query
          description: Фильтр по группе. Можно указать несколько групп через запятую.
          schema:
            type: string
        - name: status
          in: query
          description: Фильтр по статусу
          schema:
            type: string
            enum: [ill, residents, non_residents, no_residence]
      responses:
        '200':
          description: Список студентов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'

  /api/employee/{emp_id}:
    get:
      tags: [Employees]
      summary: Получить информацию о студенте
      description: Получить подробную информацию о конкретном студенте
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Информация о студенте
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/Employee'
        '404':
          description: Студент не найден

  /api/employee/{emp_id}/changes_history:
    get:
      tags: [Employees]
      summary: Получить историю изменений студента
      description: Возвращает историю изменений полей студента
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: История изменений
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    admin_id:
                      type: integer
                    admin_username:
                      type: string
                    field_name:
                      type: string
                    old_value:
                      type: string
                    new_value:
                      type: string
                    changed_at:
                      type: string
                      format: date-time

  /api/employee/{emp_id}/roommates:
    get:
      tags: [Employees]
      summary: Получить соседей по комнате
      description: Возвращает список студентов, проживающих в той же комнате
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список соседей
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Employee'

  /api/admin/employee:
    post:
      tags: [Employees]
      summary: Создать нового студента
      description: Создает нового студента в системе
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: Студент создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  id:
                    type: integer
        '400':
          description: Ошибка валидации

  /api/admin/employee/{emp_id}:
    post:
      tags: [Employees]
      summary: Обновить данные студента
      description: Обновляет данные существующего студента
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/EmployeeInput'
      responses:
        '200':
          description: Данные обновлены
        '400':
          description: Ошибка валидации
        '404':
          description: Студент не найден
    delete:
      tags: [Employees]
      summary: Удалить студента
      description: Удаляет студента из системы
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Студент удален
        '404':
          description: Студент не найден

  /api/admin/photo/{emp_id}:
    post:
      tags: [Employees]
      summary: Загрузить фото студента
      description: Загружает или обновляет фотографию студента
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                photo:
                  type: string
                  format: binary
      responses:
        '200':
          description: Фото загружено
        '400':
          description: Ошибка валидации

  /api/employee/{emp_id}/files:
    get:
      tags: [Employees]
      summary: Получить список файлов студента
      description: Возвращает список всех файлов, прикрепленных к студенту
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Список файлов
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    filename:
                      type: string
                    uploaded_at:
                      type: string
                      format: date-time
    post:
      tags: [Employees]
      summary: Загрузить файл для студента
      description: Загружает файл и прикрепляет его к студенту
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                file:
                  type: string
                  format: binary
      responses:
        '200':
          description: Файл загружен
        '400':
          description: Ошибка валидации

  /api/employee/{emp_id}/files/{file_id}:
    delete:
      tags: [Employees]
      summary: Удалить файл студента
      description: Удаляет файл, прикрепленный к студенту
      security:
        - sessionAuth: []
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл удален
        '404':
          description: Файл не найден

  /api/employee/{emp_id}/files/{file_id}/download:
    get:
      tags: [Employees]
      summary: Скачать файл студента
      description: Скачивает файл, прикрепленный к студенту
      parameters:
        - name: emp_id
          in: path
          required: true
          schema:
            type: integer
        - name: file_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Файл
          content:
            application/octet-stream:
              schema:
                type: string
                format: binary
        '404':
          description: Файл не найден

  # ==================== Admin Management ====================
  /api/admin/admins:
    get:
      tags: [Admin]
      summary: Получить список администраторов
      description: Возвращает список всех администраторов системы
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Список администраторов
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: '#/components/schemas/Admin'
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа
    post:
      tags: [Admin]
      summary: Создать нового администратора
      description: Создает нового администратора в системе
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [username, password]
              properties:
                username:
                  type: string
                password:
                  type: string
                  minLength: 6
                role:
                  type: string
                  default: vospitatel
                fio:
                  type: string
      responses:
        '200':
          description: Администратор создан
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа

  /api/admin/admins/{admin_id}:
    post:
      tags: [Admin]
      summary: Обновить администратора
      description: Обновляет данные администратора
      security:
        - sessionAuth: []
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                role:
                  type: string
                is_active:
                  type: boolean
                password:
                  type: string
                  minLength: 6
                fio:
                  type: string
      responses:
        '200':
          description: Администратор обновлен
        '400':
          description: Ошибка валидации
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа
    delete:
      tags: [Admin]
      summary: Удалить администратора
      description: Удаляет администратора из системы
      security:
        - sessionAuth: []
      parameters:
        - name: admin_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Администратор удален
        '400':
          description: Нельзя удалить самого себя
        '401':
          description: Не авторизован
        '403':
          description: Нет прав доступа

  /api/admin/roles:
    get:
      tags: [Admin]
      summary: Получить список ролей
      description: Возвращает список всех ролей и их прав доступа
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Список ролей
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    name:
                      type: string
                    permissions:
                      type: array
                      items:
                        type: string
                    description:
                      type: string
    post:
      tags: [Admin]
      summary: Создать новую роль
      description: Создает новую роль с указанными правами доступа
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [name, permissions]
              properties:
                name:
                  type: string
                permissions:
                  type: array
                  items:
                    type: string
                description:
                  type: string
      responses:
        '200':
          description: Роль создана
        '400':
          description: Ошибка валидации

  /api/admin/roles/{role_name}:
    post:
      tags: [Admin]
      summary: Обновить роль
      description: Обновляет права доступа роли
      security:
        - sessionAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                permissions:
                  type: array
                  items:
                    type: string
                description:
                  type: string
      responses:
        '200':
          description: Роль обновлена
    delete:
      tags: [Admin]
      summary: Удалить роль
      description: Удаляет роль из системы
      security:
        - sessionAuth: []
      parameters:
        - name: role_name
          in: path
          required: true
          schema:
            type: string
      responses:
        '200':
          description: Роль удалена

  /api/admin/change_password:
    post:
      tags: [Admin]
      summary: Изменить пароль
      description: Изменяет пароль текущего администратора
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [old_password, new_password]
              properties:
                old_password:
                  type: string
                  format: password
                new_password:
                  type: string
                  format: password
                  minLength: 6
      responses:
        '200':
          description: Пароль изменен
        '400':
          description: Неверный старый пароль или ошибка валидации

  # ==================== Rooms ====================
  /api/admin/rooms:
    get:
      tags: [Rooms]
      summary: Получить список комнат
      description: Возвращает список всех комнат с информацией о студентах и оплатах
      security:
        - sessionAuth: []
      parameters:
        - name: month
          in: query
          description: Месяц для проверки оплат (формат YYYY-MM)
          schema:
            type: string
      responses:
        '200':
          description: Список комнат
          content:
            application/json:
              schema:
                type: object
                properties:
                  success:
                    type: boolean
                  rooms:
                    type: array
                    items:
                      $ref: '#/components/schemas/Room'
                  month:
                    type: string
    post:
      tags: [Rooms]
      summary: Создать комнату
      description: Создает новую комнату в системе
      security:
        - sessionAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [building, entrance, room_number]
              properties:
                building:
                  type: string
                entrance:
                  type: string
                room_number:
                  type: string
                floor:
                  type: integer
                excluded_from_duty:
                  type: boolean
                category_id:
                  type: integer
      responses:
        '200':
          description: Комната создана
        '400':
          description: Ошибка валидации

  /api/admin/rooms/{room_id}:
    post:
      tags: [Rooms]
      summary: Обновить комнату
      description: Обновляет данные комнаты
      security:
        - sessionAuth: []
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                building:
                  type: string
                entrance:
                  type: string
                room_number:
                  type: string
                floor:
                  type: integer
                excluded_from_duty:
                  type: boolean
                category_id:
                  type: integer
      responses:
        '200':
          description: Комната обновлена
        '400':
          description: Ошибка валидации
        '404':
          description: Комната не найдена
    delete:
      tags: [Rooms]
      summary: Удалить комнату
      description: Удаляет комнату из системы
      security:
        - sessionAuth: []
      parameters:
        - name: room_id
          in: path
          required: true
          schema:
            type: integer
      responses:
        '200':
          description: Комната удалена
        '404':
          description: Комната не найдена

  /api/rooms/list:
    get:
      tags: [Rooms]
      summary: Получить упрощенный список комнат
      description: Возвращает упрощенный список всех комнат
      responses:
        '200':
          description: Список комнат
          content:
            application/json:
              schema:
                type: array
                items:
                  type: object
                  properties:
                    id:
                      type: integer
                    building:
                      type: string
                    entrance:
                      type: string
                    room_number:
                      type: string

  /api/admin/room_categories:
    get:
      tags: [Rooms]
      summary: Получить список категорий комнат
      description: Возвращает список всех категорий комнат
      security:
        - sessionAuth: []
      responses:
        '200':
          description: Список категорий
          content:
            application/json:
              schema:
                type: array
                items:
