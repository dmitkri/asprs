<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Управление ролями</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">

        }

            white-space: nowrap;
            pointer-events: none;
        }
        .top-menu-item.back-to-panel {

        }

                                <div class="permission-item">

                                <div class="permission-item">
                                    <div class="form-check">

                                        <label class="form-check-label" for="addViewReports">Просмотр отчетов</label>
                                    </div>

                                    <div class="form-check">

                                        <label class="form-check-label" for="addManageTgUsers">Управление Telegram пользователями</label>

                    </button>
                </div>
            </div>

                                <div class="permission-item">

                                <div class="permission-item">

                                <div class="permission-item">

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="/static/js/consta-banner.js"></script>
    <script>
        const permissionLabels = {
            'view': 'Просмотр',
            'edit': 'Редактирование студентов',
            'delete': 'Удаление студентов',
            'import': 'Импорт Excel',
            'manage_columns': 'Управление столбцами',
            'manage_admins': 'Управление администраторами',
            'manage_bed_linen': 'Управление бельем',
            'manage_send_messages': 'Отправка сообщений',
            'view_reports': 'Просмотр отчетов',
            'manage_tg_users': 'Управление Telegram пользователями',
            'scan_qr': 'Сканер QR-кодов',
            'manage_payments': 'Управление оплатами',
            'manage_rooms': 'Управление комнатами',
            'manage_minors': 'Управление несовершеннолетними',
            'manage_round_assignments': 'Управление назначениями на обход',
            'manage_events': 'Управление календарем мероприятий',
            'all': 'Все права'
        };


        async function loadRoles() {
            try {
                const response = await fetch('/api/admin/roles');
                const data = await response.json();
                
                if (data.success) {
                    renderRoles(data.roles);
                } else {
                    const errorMsg = data.error || 'Ошибка загрузки ролей';
                    $('#rolesList').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    }
                }
            } catch (error) {
                const errorMsg = 'Ошибка загрузки ролей: ' + (error.message || 'Неизвестная ошибка');
                $('#rolesList').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                }
            }
        }

        function renderRoles(roles) {
            const container = $('#rolesList');
            container.empty();

            if (roles.length === 0) {
                container.html('<div class="col-12"><div class="alert alert-info">Роли не созданы</div></div>');
                return;
            }

            roles.forEach(role => {
                const permissions = role.permissions || {};
                const isSystem = role.name === 'super_admin' || role.name === 'admin';

                const permList = Object.keys(permissions).filter(p => 
                    permissions[p] && p !== 'all' && p !== 'manage_health' && p !== 'manage_vacation'
                );

                const displayPerms = [...permList];
                if (permissions.edit && !permissions.all) {
                    if (!displayPerms.includes('Управление здоровьем')) {
                        displayPerms.push('Управление здоровьем');
                    }
                    if (!displayPerms.includes('Управление отпусками')) {
                        displayPerms.push('Управление отпусками');
                    }
                }
                
                const card = $(`
                    <div class="col-md-6 col-lg-4 mb-3">
                        <div class="card h-100">
                            <div class="card-body">
                                <h5 class="card-title">${role.name} ${isSystem ? '<span class="badge bg-secondary">Системная</span>' : ''}</h5>
                                <p class="card-text text-muted">${role.description || 'Нет описания'}</p>
                                <div class="mb-2">
                                    <strong>Права:</strong>
                                    ${permissions.all ? '<span class="badge bg-success">Все права</span>' : 
                                        permList.length > 0 ? 
                                            permList.map(p => `<span class="badge bg-primary">${permissionLabels[p] || p}</span>`).join(' ') + 
                                            (permissions.edit ? ' <span class="badge bg-info">Управление здоровьем</span> <span class="badge bg-info">Управление отпусками</span>' : '') : 
                                            '<span class="badge bg-secondary">Нет прав</span>'}
                                </div>
                                ${!isSystem ? `<button class="btn btn-sm btn-primary" onclick="editRole('${role.name}')">Редактировать</button>` : ''}
                            </div>
                        </div>
                    </div>
                `);
                container.append(card);
            });
        }


        $('#addAll, #editAll').on('change', function() {
            const isChecked = $(this).is(':checked');
            const prefix = $(this).attr('id').includes('add') ? 'add' : 'edit';

            $(`.perm-checkbox:not(:disabled)`).prop('checked', isChecked);
        });


        $('.perm-checkbox').on('change', function() {
            if ($(this).is(':disabled')) return;
            const modal = $(this).closest('.modal');
            const allCheckbox = modal.find('#addAll, #editAll');
            const prefix = allCheckbox.attr('id').includes('add') ? 'add' : 'edit';
            const allChecked = modal.find(`.perm-checkbox:not(:checked):not(:disabled)`).length === 0;
            allCheckbox.prop('checked', allChecked);
        });


        $('#submitAddRoleBtn').on('click', async function() {
            const name = $('#newRoleName').val().trim();
            const description = $('#newRoleDescription').val().trim();
            
            if (!name) {
                $('#addRoleStatus').html('<div class="alert alert-danger">Название роли обязательно</div>');
                return;
            }


            const permissions = {};
            if ($('#addAll').is(':checked')) {
                permissions.all = true;
            } else {

                $('.perm-checkbox:checked:not(:disabled)').each(function() {
                    permissions[$(this).val()] = true;
                });

                if (permissions.edit) {

                }
            }

            $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Создание...');
            $('#addRoleStatus').html('');

            try {
                const response = await fetch('/api/admin/roles', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({name, permissions, description})
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    $('#addRoleStatus').html('<div class="alert alert-success">Роль успешно создана</div>');
                    if (typeof showBannerSuccess !== 'undefined') {
                        showBannerSuccess('Роль успешно создана', 'Успешно');
                    }
                    $('#addRoleForm')[0].reset();
                    setTimeout(() => {
                        $('#addRoleModal').modal('hide');
                        loadRoles();
                    }, 1000);
                } else {
                    const errorMsg = data.error || 'Ошибка создания';
                    $('#addRoleStatus').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    }
                }
            } catch (error) {
                const errorMsg = 'Ошибка: ' + (error.message || 'Неизвестная ошибка');
                $('#addRoleStatus').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                }
            } finally {
                $(this).prop('disabled', false).html('<i class="bi bi-check-circle"></i> Создать');
            }
        });


        async function editRole(roleName) {
            try {
                const response = await fetch('/api/admin/roles');
                const data = await response.json();
                
                if (data.success) {
                    const role = data.roles.find(r => r.name === roleName);
                    if (role) {
                        const isSystem = role.name === 'super_admin' || role.name === 'admin';
                        
                        $('#editRoleName').val(role.name);
                        $('#editRoleNameDisplay').val(role.name);
                        $('#editRoleDescription').val(role.description || '');
                        
                        const permissions = role.permissions || {};
                        if (permissions.all) {
                            $('#editAll').prop('checked', true);
                            $('.perm-checkbox:not(:disabled)').prop('checked', false);
                        } else {
                            $('#editAll').prop('checked', false);
                            $('.perm-checkbox:not(:disabled)').each(function() {
                                $(this).prop('checked', permissions[$(this).val()] || false);
                            });
                        }
                        
                        // Скрываем кнопку удаления для системных ролей
                        if (isSystem) {
                            $('#deleteRoleBtn').hide();
                        } else {
                            $('#deleteRoleBtn').show();
                        }
                        
                        $('#editRoleModal').modal('show');
                    }
                }
            } catch (error) {
                const errorMsg = 'Ошибка загрузки роли: ' + (error.message || 'Неизвестная ошибка');
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                } else {
                    alert(errorMsg);
                }
            }
        }

        $('#submitEditRoleBtn').on('click', async function() {
            const roleName = $('#editRoleName').val();
            const description = $('#editRoleDescription').val().trim();
            

            const permissions = {};
            if ($('#editAll').is(':checked')) {
                permissions.all = true;
            } else {

                $('.perm-checkbox:checked:not(:disabled)').each(function() {
                    permissions[$(this).val()] = true;
                });

                if (permissions.edit) {

                }
            }

            $(this).prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Сохранение...');
            $('#editRoleStatus').html('');

            try {
                const response = await fetch(`/api/admin/roles/${roleName}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({permissions, description})
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    $('#editRoleStatus').html('<div class="alert alert-success">Роль успешно обновлена</div>');
                    if (typeof showBannerSuccess !== 'undefined') {
                        showBannerSuccess('Роль успешно обновлена', 'Успешно');
                    }
                    setTimeout(() => {
                        $('#editRoleModal').modal('hide');
                        loadRoles();
                    }, 1000);
                } else {
                    const errorMsg = data.error || 'Ошибка обновления';
                    $('#editRoleStatus').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    }
                }
            } catch (error) {
                const errorMsg = 'Ошибка: ' + (error.message || 'Неизвестная ошибка');
                $('#editRoleStatus').html(`<div class="alert alert-danger">${errorMsg}</div>`);
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                }
            } finally {
                $(this).prop('disabled', false).html('<i class="bi bi-check-circle"></i> Сохранить');
            }
        });



        // Убеждаемся, что обработчик удаления правильно привязан
        $(document).on('click', '#deleteRoleBtn', async function(e) {
            e.preventDefault();
            e.stopPropagation();
            
            console.log('Кнопка удаления нажата');
            
            const roleName = $('#editRoleName').val();
            if (!roleName) {
                const errorMsg = 'Ошибка: Название роли не найдено';
                console.error('Название роли не найдено');
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                } else {
                    alert(errorMsg);
                }
                return;
            }
            
            // Проверяем, не является ли роль системной
            const isSystem = roleName === 'super_admin' || roleName === 'admin';
            if (isSystem) {
                const errorMsg = 'Системные роли нельзя удалять';
                if (typeof showBannerError !== 'undefined') {
                    showBannerError(errorMsg, 'Ошибка');
                } else {
                    alert(errorMsg);
                }
                return;
            }
            
            const deleteBtn = $(this);
            
            const doDelete = async () => {
                deleteBtn.prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Удаление...');

                try {
                    const response = await fetch(`/api/admin/roles/${encodeURIComponent(roleName)}`, {
                        method: 'DELETE',
                        headers: {
                            'Content-Type': 'application/json'
                        }
                    });

                    const data = await response.json();

                    if (response.ok && data.success) {
                        if (typeof showBannerSuccess !== 'undefined') {
                            showBannerSuccess('Роль успешно удалена', 'Успешно');
                        }
                        $('#editRoleModal').modal('hide');
                        setTimeout(() => {
                            loadRoles();
                        }, 500);
                    } else {
                        const errorMsg = data.error || 'Ошибка удаления роли';
                        if (typeof showBannerError !== 'undefined') {
                            showBannerError(errorMsg, 'Ошибка');
                        } else {
                            alert(errorMsg);
                        }
                    }
                } catch (error) {
                    const errorMsg = 'Ошибка: ' + (error.message || 'Неизвестная ошибка');
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    } else {
                        alert(errorMsg);
                    }
                } finally {
                    deleteBtn.prop('disabled', false).html('<i class="bi bi-trash"></i> Удалить');
                }
            };
            
            console.log('showBannerConfirm определен:', typeof showBannerConfirm !== 'undefined');
            console.log('window.showBannerConfirm определен:', typeof window.showBannerConfirm !== 'undefined');
            
            if (typeof showBannerConfirm !== 'undefined' || typeof window.showBannerConfirm !== 'undefined') {
                const confirmFn = showBannerConfirm || window.showBannerConfirm;
                console.log('Вызываем showBannerConfirm');
                try {
                    confirmFn(
                        'Вы уверены, что хотите удалить эту роль?',
                        doDelete,
                        () => {
                            console.log('Удаление отменено');
                        }
                    );
                } catch (err) {
                    console.error('Ошибка при вызове showBannerConfirm:', err);
                    // Fallback на обычный confirm
                    if (confirm('Вы уверены, что хотите удалить эту роль?')) {
                        doDelete();
                    }
                }
            } else {
                console.log('showBannerConfirm не определен, используем confirm');
                if (confirm('Вы уверены, что хотите удалить эту роль?')) {
                    doDelete();
                }
            }
        });

        $(document).ready(function() {
            loadRoles();
        });
    </script>

    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
