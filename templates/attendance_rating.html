<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Рейтинг посещаемости</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/static/css/consta-datepicker.css">
    <link rel="stylesheet" href="/static/css/consta-button.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=4">
    <style>
        /* Стили для заголовка в верхнем меню */
        .top-menu-content {
            position: relative;
        }
        .top-menu-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #ffffff !important;
            font-size: 1.25rem;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }
        .top-menu-item.back-to-panel {
            margin-right: auto;
        }
        /* Увеличенный z-index для календаря, чтобы он был поверх других элементов */
        .flatpickr-calendar {
            z-index: 10000 !important;
            position: fixed !important;
        }
        .flatpickr-calendar.open {
            z-index: 10000 !important;
            position: fixed !important;
        }
        /* Убираем overflow у карточек, чтобы календарь не обрезался */
        .card {
            overflow: visible !important;
        }
        .card-body {
            overflow: visible !important;
        }
        .table-responsive {
            overflow: visible !important;
        }
        /* Убираем overflow у контейнера */
        .container {
            overflow: visible !important;
        }
    </style>
</head>
<body>
    
    <div class="top-menu-bar">
        <div class="top-menu-content">
            <a href="/admin" class="top-menu-item back-to-panel">
                <i class="bi bi-arrow-left"></i>
                <span>Назад в панель</span>
            </a>
            <h2 class="top-menu-title">Рейтинг посещаемости мероприятий</h2>
            <a href="/events/calendar" class="top-menu-item">
                <i class="bi bi-calendar-event"></i>
                <span>Календарь мероприятий</span>
            </a>
        </div>
    </div>

    <div class="container mt-4" style="margin-top: 80px !important;">

        <div class="card mb-4">
            <div class="card-header">
                <h5 class="mb-0">Фильтр</h5>
            </div>
            <div class="card-body">
                <div class="row">
                    <div class="col-md-4">
                        <label for="startDate" class="form-label">Дата начала</label>
                        <input type="date" class="form-control" id="startDate">
                    </div>
                    <div class="col-md-4">
                        <label for="endDate" class="form-label">Дата окончания</label>
                        <input type="date" class="form-control" id="endDate">
                    </div>
                    <div class="col-md-4">
                        <label for="limit" class="form-label">Количество записей</label>
                        <input type="number" class="form-control" id="limit" value="50" min="1" max="500">
                    </div>
                </div>
                <div class="mt-3">
                    <button class="btn btn-primary" onclick="loadRating()">
                        <i class="bi bi-search"></i> Применить фильтры
                    </button>
                    <button class="btn btn-secondary" onclick="resetFilters()">
                        <i class="bi bi-arrow-counterclockwise"></i> Сбросить
                    </button>
                </div>
            </div>
        </div>

        <div class="card">
            <div class="card-header">
                <h5 class="mb-0">Топ студентов по посещаемости</h5>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-striped">
                        <thead>
                            <tr>
                                <th>Место</th>
                                <th>ФИО</th>
                                <th>Группа</th>
                                <th>Комната</th>
                                <th>Посещений</th>
                            </tr>
                        </thead>
                        <tbody id="ratingBody">
                            <tr>
                                <td colspan="5" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>

        function convertDateFormat(dateStr) {
            if (!dateStr) return '';

            if (dateStr.match(/^\d{4}-\d{2}-\d{2}$/)) {
                return dateStr;
            }

            if (dateStr.match(/^\d{2}\.\d{2}\.\d{4}$/)) {
                const [day, month, year] = dateStr.split('.');
                return `${year}-${month}-${day}`;
            }
            return dateStr;
        }

        async function loadRating() {
            let startDate = $('#startDate').val();
            let endDate = $('#endDate').val();
            const limit = $('#limit').val() || 50;
            

            startDate = convertDateFormat(startDate);
            endDate = convertDateFormat(endDate);
            
            const params = new URLSearchParams();
            if (startDate) params.append('start_date', startDate);
            if (endDate) params.append('end_date', endDate);
            params.append('limit', limit);
            
            try {
                const response = await fetch(`/api/events/attendance/rating?${params.toString()}`);
                const data = await response.json();
                
                const tbody = $('#ratingBody');
                tbody.empty();
                
                if (data.success && data.rating) {
                    if (data.rating.length === 0) {
                        tbody.append('<tr><td colspan="5" class="text-center text-muted">Нет данных</td></tr>');
                        return;
                    }
                    
                    data.rating.forEach((item, index) => {
                        const room = [item.building, item.entrance, item.room_number].filter(Boolean).join('-') || 'не указана';
                        const medal = index === 0 ? '🥇' : index === 1 ? '🥈' : index === 2 ? '🥉' : '';
                        
                        tbody.append(`
                            <tr>
                                <td>${medal} ${index + 1}</td>
                                <td>${escapeHtml(item.fio || '')}</td>
                                <td>${escapeHtml(item.group_name || '')}</td>
                                <td>${escapeHtml(room)}</td>
                                <td><strong>${item.attendance_count}</strong></td>
                            </tr>
                        `);
                    });
                }
            } catch (error) {
                
                $('#ratingBody').html('<tr><td colspan="5" class="text-center text-danger">Ошибка загрузки данных</td></tr>');
            }
        }

        function resetFilters() {
            $('#startDate').val('');
            $('#endDate').val('');
            $('#limit').val('50');
            loadRating();
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        $(document).ready(function() {
            loadRating();
            

            if (typeof flatpickr !== 'undefined') {

                document.querySelectorAll('input[type="date"]').forEach(input => {
                    if (input.classList.contains('consta-datepicker-initialized')) return;
                    

                    input.removeAttribute('data-no-consta-datepicker');
                    
                    const locale = flatpickr.l10ns.ru || {
                        firstDayOfWeek: 1,
                        weekdays: {
                            shorthand: ['Вс', 'Пн', 'Вт', 'Ср', 'Чт', 'Пт', 'Сб'],
                            longhand: ['Воскресенье', 'Понедельник', 'Вторник', 'Среда', 'Четверг', 'Пятница', 'Суббота']
                        },
                        months: {
                            shorthand: ['Янв', 'Фев', 'Мар', 'Апр', 'Май', 'Июн', 'Июл', 'Авг', 'Сен', 'Окт', 'Ноя', 'Дек'],
                            longhand: ['Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь']
                        }
                    };
                    
                    try {
                        const fp = flatpickr(input, {
                            dateFormat: 'd.m.Y',
                            locale: locale,
                            allowInput: true,
                            clickOpens: true,
                            animate: true,
                            static: false,
                            appendTo: document.body,
                            position: 'auto',
                            monthSelectorType: 'static'
                        });
                        
                        input.classList.add('consta-datepicker-initialized');
                    } catch (e) {
                        
                    }
                });
            } else if (typeof ConstaDatePicker !== 'undefined') {
                ConstaDatePicker.init();
            }
        });
    </script>
    
    
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="/static/js/consta-datepicker.js"></script>
</body>
</html>
