<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Несовершеннолетние студенты</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/static/css/consta-datepicker.css">
    <link rel="stylesheet" href="/static/css/consta-banner.css">
    <link rel="stylesheet" href="/static/css/consta-button.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        .entrance-section {
            margin-bottom: 30px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            padding: 20px;
        }
        .student-item {
            padding: 10px;
            border-bottom: 1px solid #f0f0f0;
        }
        .student-item:last-child {
            border-bottom: none;
        }
    </style>
</head>
<body>
    
    <div class="top-menu-bar">
        <div class="top-menu-content">
            <a href="/admin" class="top-menu-item back-to-panel">
                <i class="bi bi-arrow-left"></i>
                <span>Назад в панель</span>
            </a>
            <h2 class="top-menu-title">Несовершеннолетние студенты по подъездам</h2>
            <button class="top-menu-item" id="sendLocationQuestionBtn" onclick="sendLocationQuestionToAbsent()">
                <i class="bi bi-telegram"></i>
                <span>Отправить сообщение отсутствующим</span>
            </button>
        </div>
    </div>

    <div class="container mt-4" style="margin-top: 80px !important;">
        
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="buildingFilter" class="form-label">Фильтр по корпусу:</label>
                <select id="buildingFilter" class="form-select" onchange="loadMinors()">
                    <option value="">Все корпуса</option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="dateFilter" class="form-label">Дата обхода:</label>
                <input type="text" id="dateFilter" class="form-control" placeholder="дд.мм.гггг" onchange="loadMinors()">
            </div>
        </div>

        <div id="minorsList">
            <div class="text-center py-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>
    </div>


    <script>
        function formatDateToISO(dateStr) {

            if (!dateStr) return '';
            const parts = dateStr.split('.');
            if (parts.length === 3) {
                return `${parts[2]}-${parts[1]}-${parts[0]}`;
            }
            return dateStr;
        }

        function formatDateToDisplay(dateStr) {

            if (!dateStr) return '';
            const parts = dateStr.split('-');
            if (parts.length === 3) {
                return `${parts[2]}.${parts[1]}.${parts[0]}`;
            }
            return dateStr;
        }

        function loadMinors() {
            const building = $('#buildingFilter').val();
            const dateDisplay = $('#dateFilter').val();
            const date = formatDateToISO(dateDisplay);
            
            $.ajax({
                url: '/api/minors/list',
                method: 'GET',
                data: { 
                    building: building,
                    date: date
                },
                success: function(response) {
                    if (response.success) {
                        renderMinors(response.minors);
                        updateBuildingFilter(response.buildings);
                        

                        if (!dateDisplay && response.date) {
                            $('#dateFilter').val(formatDateToDisplay(response.date));
                        }
                    }
                },
                error: function(xhr) {
                    
                    $('#minorsList').html('<div class="alert alert-danger">Ошибка загрузки данных</div>');
                }
            });
        }

        function updateBuildingFilter(buildings) {
            const select = $('#buildingFilter');
            const currentValue = select.val();
            select.empty();
            select.append('<option value="">Все корпуса</option>');
            buildings.forEach(b => {
                select.append(`<option value="${b}">Корпус ${b}</option>`);
            });
            select.val(currentValue);
        }

        function renderMinors(minors) {
            const container = $('#minorsList');
            container.empty();

            if (!minors || Object.keys(minors).length === 0) {
                container.html('<div class="alert alert-info">Нет несовершеннолетних студентов</div>');
                return;
            }
            

            const totalStudents = Object.values(minors).reduce((sum, entrances) => 
                sum + Object.values(entrances).reduce((s, students) => s + students.length, 0), 0);
            
            if (totalStudents === 0) {
                container.html('<div class="alert alert-info">Нет несовершеннолетних студентов</div>');
                return;
            }

            let html = '';
            

            const sortedBuildings = Object.keys(minors).sort();
            
            for (const building of sortedBuildings) {
                const entrances = minors[building];
                const sortedEntrances = Object.keys(entrances).sort();
                
                for (const entrance of sortedEntrances) {
                    const students = entrances[entrance];
                    

                    const sortedStudents = students.sort((a, b) => {
                        const roomA = parseInt(a.room_number) || 9999;
                        const roomB = parseInt(b.room_number) || 9999;
                        if (roomA !== roomB) return roomA - roomB;
                        return a.fio.localeCompare(b.fio);
                    });
                    
                    html += `
                        <div class="entrance-section">
                            <h4>Корпус ${building}, Подъезд ${entrance}</h4>
                            <div class="table-responsive">
                                <table class="table table-striped">
                                    <thead>
                                        <tr>
                                            <th>Комната</th>
                                            <th>ФИО</th>
                                            <th>Обход</th>
                                            <th>Заявление</th>
                                            <th>Отметка обхода</th>
                                        </tr>
                                    </thead>
                                    <tbody>
                    `;
                    
                    sortedStudents.forEach(student => {
                        const vacationText = student.vacation ? escapeHtml(student.vacation) : '';
                        

                        let roundMark = '-';
                        if (student.round_status) {
                            if (student.round_status === 'present') {
                                roundMark = '<span style="color: green; font-size: 1.2em;">✅</span>';
                            } else if (student.round_status === 'absent') {
                                roundMark = '<span style="color: red; font-size: 1.2em;">❌</span>';
                            }
                            if (student.round_time) {

                                const timeParts = student.round_time.split(':');
                                if (timeParts.length >= 2) {
                                    roundMark += ` <small style="color: #666;">${timeParts[0]}:${timeParts[1]}</small>`;
                                }
                            }
                        }
                        

                        let formattedVacation = vacationText || '-';
                        if (vacationText) {
                            try {

                                const datePattern = /(\d{2})\.(\d{2})\.(\d{4})/g;
                                const dates = [];
                                let match;
                                
                                while ((match = datePattern.exec(vacationText)) !== null) {
                                    dates.push(`${match[1]}.${match[2]}.${match[3]}`);
                                }
                                
                                if (dates.length > 0) {

                                    if (dates.length === 2) {
                                        formattedVacation = `${dates[0]} - ${dates[1]}`;
                                    } else if (dates.length === 1) {
                                        formattedVacation = dates[0];
                                    }
                                } else {


                                    const isoDateMatch = vacationText.match(/(\d{4})-(\d{2})-(\d{2})/);
                                    if (isoDateMatch) {
                                        formattedVacation = `${isoDateMatch[3]}.${isoDateMatch[2]}.${isoDateMatch[1]}`;
                                    } else {

                                        const dateObj = new Date(vacationText);
                                        if (!isNaN(dateObj.getTime())) {
                                            const day = String(dateObj.getDate()).padStart(2, '0');
                                            const month = String(dateObj.getMonth() + 1).padStart(2, '0');
                                            const year = dateObj.getFullYear();
                                            formattedVacation = `${day}.${month}.${year}`;
                                        }
                                    }
                                }
                            } catch (e) {

                                formattedVacation = vacationText;
                            }
                        }
                        

                        let isMinorChecked = '';
                        let isMinorText = 'Не отмечено';
                        
                        if (student.round_status === 'present') {
                            isMinorChecked = 'checked';
                            isMinorText = 'Был';
                        } else if (student.round_status === 'absent') {
                            isMinorText = 'Не был';
                        }
                        
                        html += `
                            <tr>
                                <td>${student.room_number}</td>
                                <td>${escapeHtml(student.fio)}</td>
                                <td>${roundMark}</td>
                                <td>${formattedVacation}</td>
                                <td>
                                    <div class="form-check form-switch">
                                        <input class="form-check-input minor-checkbox" type="checkbox" 
                                               id="minor_${student.id}" 
                                               data-student-id="${student.id}"
                                               ${isMinorChecked}
                                               onchange="toggleMinor(${student.id}, this.checked)">
                                        <label class="form-check-label" for="minor_${student.id}">
                                            ${isMinorText}
                                        </label>
                                    </div>
                                </td>
                            </tr>
                        `;
                    });
                    
                    html += `
                                    </tbody>
                                </table>
                            </div>
                        </div>
                    `;
                }
            }
            
            container.html(html);
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }

        function toggleMinor(studentId, isMinor) {

            const dateDisplay = $('#dateFilter').val();
            const date = formatDateToISO(dateDisplay);
            
            if (!date) {
                if (typeof showBannerWarning !== 'undefined') {
                    showBannerWarning('Пожалуйста, выберите дату обхода', 'Внимание');
                } else {
                    alert('Пожалуйста, выберите дату обхода');
                }

                const checkbox = $(`#minor_${studentId}`);
                checkbox.prop('checked', !isMinor);
                return;
            }
            

            const isMinorValue = isMinor ? 1 : 0;
            
            $.ajax({
                url: '/api/minors/set_minor',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({
                    student_id: studentId,
                    is_minor: isMinorValue,
                    date: date
                }),
                success: function(response) {
                    if (response.success) {

                        const label = $(`#minor_${studentId}`).next('label');
                        label.text(isMinor ? 'Был' : 'Не был');
                        

                        loadMinors();
                    } else {

                        const checkbox = $(`#minor_${studentId}`);
                        checkbox.prop('checked', !isMinor);
                        
                        const errorMsg = response.error || 'Ошибка при обновлении статуса';
                        if (typeof showBannerError !== 'undefined') {
                            showBannerError(errorMsg, 'Ошибка');
                        } else {
                            alert(errorMsg);
                        }
                    }
                },
                error: function(xhr) {

                    const checkbox = $(`#minor_${studentId}`);
                    checkbox.prop('checked', !isMinor);
                    
                    let errorMsg = 'Ошибка при обновлении статуса';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg = xhr.responseJSON.error;
                    }
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    } else {
                        alert(errorMsg);
                    }
                }
            });
        }


        function sendLocationQuestionToAbsent() {
            const dateDisplay = $('#dateFilter').val();
            const date = formatDateToISO(dateDisplay);
            if (!date) {
                if (typeof showBannerWarning !== 'undefined') {
                    showBannerWarning('Пожалуйста, выберите дату обхода', 'Внимание');
                } else {
                    alert('Пожалуйста, выберите дату обхода');
                }
                return;
            }
            
            const message = 'Отправить сообщение "Где вы находитесь?" всем несовершеннолетним, которых не было во время обхода?';
            
            if (typeof showBannerConfirm !== 'undefined') {
                showBannerConfirm(
                    message,
                    function() {
                        doSendLocationQuestion(date);
                    },
                    function() {

                    }
                );
            } else {
                if (!confirm(message)) {
                    return;
                }
                doSendLocationQuestion(date);
            }
        }
        
        function doSendLocationQuestion(date) {

            const btn = $('#sendLocationQuestionBtn');
            const originalText = btn.html();
            btn.prop('disabled', true);
            btn.html('<i class="bi bi-hourglass-split"></i> <span>Отправка...</span>');
            
            $.ajax({
                url: '/api/minors/send_location_question',
                method: 'POST',
                contentType: 'application/json',
                data: JSON.stringify({ date: date }),
                success: function(response) {
                    if (response.success) {
                        const message = `Сообщения отправлены:\n- Успешно: ${response.sent_count}\n- Ошибок: ${response.failed_count}`;
                        if (typeof showBannerSuccess !== 'undefined') {
                            showBannerSuccess(message.replace(/\n/g, '<br>'), 'Успешно', [], 8000);
                        } else {
                            alert(message);
                        }
                        loadMinors();
                    } else {
                        const errorMsg = 'Ошибка: ' + (response.error || 'Не удалось отправить сообщения');
                        if (typeof showBannerError !== 'undefined') {
                            showBannerError(errorMsg, 'Ошибка');
                        } else {
                            alert(errorMsg);
                        }
                    }
                },
                error: function(xhr) {
                    let errorMsg = 'Ошибка при отправке сообщений';
                    if (xhr.responseJSON && xhr.responseJSON.error) {
                        errorMsg = xhr.responseJSON.error;
                    }
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError(errorMsg, 'Ошибка');
                    } else {
                        alert(errorMsg);
                    }
                },
                complete: function() {
                    btn.prop('disabled', false);
                    btn.html(originalText);
                }
            });
        }

        $(document).ready(function() {

            const today = new Date();
            const day = String(today.getDate()).padStart(2, '0');
            const month = String(today.getMonth() + 1).padStart(2, '0');
            const year = today.getFullYear();
            $('#dateFilter').val(`${day}.${month}.${year}`);
            

            if (typeof flatpickr !== 'undefined') {
                flatpickr('#dateFilter', {
                    dateFormat: 'd.m.Y',
                    locale: flatpickr.l10ns.ru || 'ru',
                    allowInput: true,
                    clickOpens: true,
                    onChange: function(selectedDates, dateStr, instance) {
                        loadMinors();
                    }
                });
            }
            
            loadMinors();
        });
    </script>
    
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="/static/js/consta-datepicker.js"></script>
    <script src="/static/js/consta-banner.js"></script>
    
    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
</html>
