<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Графики дежурств</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/consta-banner.css">
    <link rel="stylesheet" href="/static/css/consta-button.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=4">
    <style>
        .top-menu-content {
            position: relative;
        }
        .top-menu-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #ffffff !important;
            font-size: 1.25rem;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }
        .top-menu-item.back-to-panel {
            margin-right: auto;
        }
        .schedule-card {
            margin-bottom: 20px;
            border: 1px solid #dee2e6;
            border-radius: 8px;
            overflow: hidden;
        }
        .schedule-header {
            background-color: #f8f9fa;
            padding: 15px;
            border-bottom: 1px solid #dee2e6;
        }
        .schedule-body {
            padding: 15px;
        }
        .calendar-grid {
            display: grid;
            grid-template-columns: repeat(7, 1fr);
            gap: 8px;
            margin-top: 15px;
        }
        .calendar-day {
            border: 1px solid #dee2e6;
            border-radius: 4px;
            padding: 8px;
            min-height: 80px;
            background-color: #ffffff;
        }
        .calendar-day-header {
            font-weight: bold;
            font-size: 0.85rem;
            color: #6c757d;
            margin-bottom: 5px;
        }
        .calendar-day-date {
            font-size: 0.75rem;
            color: #495057;
            margin-bottom: 5px;
        }
        .calendar-day-room {
            font-weight: bold;
            font-size: 0.9rem;
            color: #212529;
        }
        .calendar-day.empty {
            background-color: #f8f9fa;
            border: none;
        }
        .instructions-section {
            background-color: #e7f3ff;
            padding: 15px;
            border-radius: 8px;
            margin-bottom: 20px;
        }
        .instructions-section h6 {
            font-weight: bold;
            margin-bottom: 10px;
        }
        .instructions-section ul {
            margin-bottom: 0;
            padding-left: 20px;
        }
        .instructions-section li {
            margin-bottom: 5px;
        }
    </style>
</head>
<body>
    
    <div class="top-menu-bar">
        <div class="top-menu-content">
            <a href="/admin" class="top-menu-item back-to-panel">
                <i class="bi bi-arrow-left"></i>
                <span>Назад в панель</span>
            </a>
            <h2 class="top-menu-title">Графики дежурств</h2>
        </div>
    </div>
    
    <div class="container mt-4" style="margin-top: 80px !important;">
        <div class="mb-4">
            <p class="text-muted">Просмотр графиков дежурств, сгенерированных старостами подъездов</p>
        </div>

        <div class="mb-3 row">
            <div class="col-md-3">
                <select id="filterBuilding" class="form-select">
                    <option value="">Все корпуса</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filterEntrance" class="form-select">
                    <option value="">Все подъезды</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filterMonth" class="form-select">
                    <option value="">Все месяцы</option>
                    <option value="1">Январь</option>
                    <option value="2">Февраль</option>
                    <option value="3">Март</option>
                    <option value="4">Апрель</option>
                    <option value="5">Май</option>
                    <option value="6">Июнь</option>
                    <option value="7">Июль</option>
                    <option value="8">Август</option>
                    <option value="9">Сентябрь</option>
                    <option value="10">Октябрь</option>
                    <option value="11">Ноябрь</option>
                    <option value="12">Декабрь</option>
                </select>
            </div>
            <div class="col-md-3">
                <select id="filterYear" class="form-select">
                    <option value="">Все годы</option>
                </select>
            </div>
        </div>

        <div id="schedulesList">
            <div class="text-center py-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        const monthNames = ['', 'Январь', 'Февраль', 'Март', 'Апрель', 'Май', 'Июнь', 
                           'Июль', 'Август', 'Сентябрь', 'Октябрь', 'Ноябрь', 'Декабрь'];
        const weekdays = ['ПН', 'ВТ', 'СР', 'ЧТ', 'ПТ', 'СБ', 'ВС'];

        function loadSchedules() {
            const building = $('#filterBuilding').val();
            const entrance = $('#filterEntrance').val();
            const month = $('#filterMonth').val();
            const year = $('#filterYear').val();

            let url = '/api/admin/duty_schedules?';
            if (building) url += `building=${building}&`;
            if (entrance) url += `entrance=${entrance}&`;
            if (month) url += `month=${month}&`;
            if (year) url += `year=${year}&`;

            $('#schedulesList').html('<div class="text-center py-4"><div class="spinner-border" role="status"><span class="visually-hidden">Загрузка...</span></div></div>');

            $.get(url)
                .done(function(response) {
                    if (response.success && response.schedules.length > 0) {
                        displaySchedules(response.schedules);
                    } else {
                        $('#schedulesList').html('<div class="alert alert-info">Графики не найдены</div>');
                    }
                })
                .fail(function() {
                    $('#schedulesList').html('<div class="alert alert-danger">Ошибка при загрузке графиков</div>');
                });
        }

        function displaySchedules(schedules) {
            let html = '';
            
            schedules.forEach(schedule => {
                const scheduleData = schedule.schedule_data || {};
                const monthName = monthNames[schedule.month] || schedule.month;
                
                html += `
                    <div class="schedule-card">
                        <div class="schedule-header">
                            <h5>График дежурств ${schedule.building}-${schedule.entrance}</h5>
                            <p class="mb-0 text-muted">
                                ${monthName} ${schedule.year} | 
                                Создан: ${new Date(schedule.created_at).toLocaleDateString('ru-RU')} | 
                                Автор: ${schedule.created_by_fio}
                            </p>
                        </div>
                        <div class="schedule-body">
                            <div class="instructions-section">
                                <h6>Инструкция</h6>
                                <ul>
                                    <li><strong>Кухня:</strong> проверка чистоты: столы, мойка, плитка; выбросить мусор</li>
                                    <li><strong>Постирочная:</strong> постиранное белье выгружено, чистота в помещении</li>
                                    <li><strong>Гладильная:</strong> глад. доски на месте на каждом этаже, утюги выключены, покрытие чистое</li>
                                    <li><strong>Коворкинги и комнаты самоподготовки:</strong> чистота, порядок в комнате</li>
                                    <li><strong>Лифт:</strong> чистота</li>
                                </ul>
                            </div>
                            ${renderCalendar(schedule.month, schedule.year, scheduleData)}
                        </div>
                    </div>
                `;
            });
            
            $('#schedulesList').html(html);
        }

        function renderCalendar(month, year, scheduleData) {
            const firstDay = new Date(year, month - 1, 1);
            const lastDay = new Date(year, month, 0);
            const daysInMonth = lastDay.getDate();
            const firstWeekday = firstDay.getDay();
            // Преобразуем воскресенье (0) в 6 для правильного отображения
            const startOffset = firstWeekday === 0 ? 6 : firstWeekday - 1;
            
            let html = '<div class="calendar-grid">';
            
            // Заголовки дней недели
            weekdays.forEach(day => {
                html += `<div class="calendar-day-header" style="grid-column: span 1; text-align: center; font-weight: bold; padding: 8px;">${day}</div>`;
            });
            
            // Пустые ячейки до первого дня
            for (let i = 0; i < startOffset; i++) {
                html += '<div class="calendar-day empty"></div>';
            }
            
            // Дни месяца
            for (let day = 1; day <= daysInMonth; day++) {
                const dateStr = `${String(day).padStart(2, '0')}.${String(month).padStart(2, '0')}.${year}`;
                const roomAssignment = scheduleData[dateStr] || '';
                
                html += `
                    <div class="calendar-day">
                        <div class="calendar-day-date">${dateStr}</div>
                        ${roomAssignment ? `<div class="calendar-day-room">${roomAssignment}</div>` : ''}
                    </div>
                `;
            }
            
            html += '</div>';
            return html;
        }

        function loadFilters() {
            // Загружаем список корпусов и подъездов
            $.get('/api/admin/duty_schedules')
                .done(function(response) {
                    if (response.success) {
                        const buildings = new Set();
                        const entrances = new Set();
                        const years = new Set();
                        
                        response.schedules.forEach(schedule => {
                            if (schedule.building) buildings.add(schedule.building);
                            if (schedule.entrance) entrances.add(schedule.entrance);
                            if (schedule.year) years.add(schedule.year);
                        });
                        
                        // Заполняем фильтры
                        buildings.forEach(b => {
                            $('#filterBuilding').append(`<option value="${b}">Корпус ${b}</option>`);
                        });
                        
                        entrances.forEach(e => {
                            $('#filterEntrance').append(`<option value="${e}">Подъезд ${e}</option>`);
                        });
                        
                        Array.from(years).sort((a, b) => b - a).forEach(y => {
                            $('#filterYear').append(`<option value="${y}">${y}</option>`);
                        });
                    }
                });
        }

        $(document).ready(function() {
            loadFilters();
            loadSchedules();
            
            $('#filterBuilding, #filterEntrance, #filterMonth, #filterYear').change(loadSchedules);
        });
    </script>
    
    <script src="/static/js/consta-banner.js"></script>
    
    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
</html>
