<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Управление администраторами</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        /* Замена цвета warning badge на #f59e0b для страницы управления администраторами */
        .badge.bg-warning {
            background-color: #f59e0b !important;
        }
        /* Замена цвета кнопки btn-warning на #f59e0b */
        .btn-warning {
            background-color: #f59e0b !important;
            border-color: #f59e0b !important;
            color: #ffffff !important;
        }
        .btn-warning:hover {
            background-color: #d97706 !important;
            border-color: #d97706 !important;
            color: #ffffff !important;
        }
        .btn-warning:focus,
        .btn-warning:active {
            background-color: #d97706 !important;
            border-color: #d97706 !important;
            color: #ffffff !important;
        }
        .top-menu-content {
            position: relative;
            display: flex;
            align-items: center;
            width: 100%;
        }
        .top-menu-title {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            margin: 0;
            color: #ffffff !important;
            font-size: 1.25rem;
            font-weight: bold;
            white-space: nowrap;
            pointer-events: none;
        }
        .top-menu-item.back-to-panel {
            margin-right: auto;
        }
        .top-menu-content .top-menu-item:last-child {
            margin-left: auto;
        }
    </style>
</head>
<body>
    <div class="top-menu-bar">
        <div class="top-menu-content">
            <a href="/admin" class="top-menu-item back-to-panel">
                <i class="bi bi-arrow-left"></i>
                <span>Назад в панель</span>
            </a>
            <h2 class="top-menu-title">Управление администраторами</h2>
            <button class="top-menu-item" data-bs-toggle="modal" data-bs-target="#addAdminModal">
                <i class="bi bi-person-plus"></i>
                <span>Добавить администратора</span>
            </button>
        </div>
    </div>
    
    <div class="container mt-4" style="margin-top: 80px !important;">

        <div class="card">
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover">
                        <thead>
                            <tr>
                                <th>ID</th>
                                <th>Логин</th>
                                <th>ФИО</th>
                                <th>Роль</th>
                                <th>Статус</th>
                                <th>Дата создания</th>
                                <th>Действия</th>
                            </tr>
                        </thead>
                        <tbody id="adminsTableBody">
                            <tr>
                                <td colspan="6" class="text-center">
                                    <div class="spinner-border" role="status">
                                        <span class="visually-hidden">Загрузка...</span>
                                    </div>
                                </td>
                            </tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="addAdminModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Добавить администратора</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="addAdminForm">
                        <div class="mb-3">
                            <label for="newAdminUsername" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="newAdminUsername" required>
                        </div>
                        <div class="mb-3">
                            <label for="newAdminPassword" class="form-label">Пароль</label>
                            <input type="password" class="form-control" id="newAdminPassword" required minlength="6">
                            <small class="form-text text-muted">Минимум 6 символов</small>
                        </div>
                        <div class="mb-3">
                            <label for="newAdminFio" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="newAdminFio" placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="mb-3">
                            <label for="newAdminRole" class="form-label">Роль</label>
                            <select class="form-select" id="newAdminRole" required>
                                <option value="">Загрузка ролей...</option>
                            </select>
                        </div>
                        <div id="addAdminStatus" class="mt-3"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="submitAddAdminBtn">
                        <i class="bi bi-check-circle"></i> Добавить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="editAdminModal" tabindex="-1">
        <div class="modal-dialog">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Редактировать администратора</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body">
                    <form id="editAdminForm">
                        <input type="hidden" id="editAdminId">
                        <div class="mb-3">
                            <label for="editAdminUsername" class="form-label">Логин</label>
                            <input type="text" class="form-control" id="editAdminUsername" readonly>
                        </div>
                        <div class="mb-3">
                            <label for="editAdminFio" class="form-label">ФИО</label>
                            <input type="text" class="form-control" id="editAdminFio" placeholder="Иванов Иван Иванович">
                        </div>
                        <div class="mb-3">
                            <label for="editAdminRole" class="form-label">Роль</label>
                            <select class="form-select" id="editAdminRole">
                                <option value="">Загрузка ролей...</option>
                            </select>
                        </div>
                        <div class="mb-3">
                            <label for="editAdminPassword" class="form-label">Новый пароль (оставьте пустым, если не меняете)</label>
                            <input type="password" class="form-control" id="editAdminPassword" minlength="6">
                            <small class="form-text text-muted">Минимум 6 символов</small>
                        </div>
                        <div class="mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="checkbox" id="editAdminIsActive">
                                <label class="form-check-label" for="editAdminIsActive">
                                    Активен
                                </label>
                            </div>
                        </div>
                        <div id="editAdminStatus" class="mt-3"></div>
                    </form>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Отмена</button>
                    <button type="button" class="btn btn-primary" id="submitEditAdminBtn">
                        <i class="bi bi-check-circle"></i> Сохранить
                    </button>
                </div>
            </div>
        </div>
    </div>

    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script>
        let currentAdminId = null;
        let allRoles = {};

        async function loadRoles() {
            try {
                const systemRoles = {
                    'super_admin': {name: 'Супер администратор', description: 'Руководитель'},
                    'admin': {name: 'Администратор', description: 'Полный доступ'},
                    'vospitatel': {name: 'Воспитатель', description: 'Доступ к большинству функций'},
                    'razmeshenie': {name: 'Администратор средства размещения', description: 'Доступ согласно предоставленной ранее информации'},
                    'audit': {name: 'Аудит', description: 'Просмотр проживаюших и оплат'}
                };

                const response = await fetch('/api/admin/roles');
                if (response.ok) {
                    const data = await response.json();
                    if (data.success) {
                        allRoles = {...systemRoles};
                        data.roles.forEach(role => {
                            allRoles[role.name] = {
                                name: role.name,
                                description: role.description || ''
                            };
                        });
                    }
                }

                const selectAdd = $('#newAdminRole');
                const selectEdit = $('#editAdminRole');
                
                selectAdd.empty();
                selectEdit.empty();

                Object.keys(systemRoles).forEach(roleKey => {
                    const role = systemRoles[roleKey];
                    selectAdd.append(`<option value="${roleKey}">${role.name} - ${role.description}</option>`);
                    selectEdit.append(`<option value="${roleKey}">${role.name} - ${role.description}</option>`);
                });

                Object.keys(allRoles).forEach(roleKey => {
                    if (!systemRoles[roleKey]) {
                        const role = allRoles[roleKey];
                        selectAdd.append(`<option value="${roleKey}">${role.name}${role.description ? ' - ' + role.description : ''}</option>`);
                        selectEdit.append(`<option value="${roleKey}">${role.name}${role.description ? ' - ' + role.description : ''}</option>`);
                    }
                });
            } catch (error) {
                
            }
        }


        async function loadAdmins() {
            try {
                const response = await fetch('/api/admin/admins');
                

                const responseText = await response.text();
                
                if (!response.ok) {
                    
                    throw new Error(`Ошибка загрузки данных: ${response.status} ${responseText}`);
                }
                

                let admins;
                try {
                    admins = JSON.parse(responseText);
                } catch (jsonError) {
                    
                    throw new Error('Некорректный ответ сервера');
                }
                
                const tbody = $('#adminsTableBody');
                tbody.empty();
                
                if (!Array.isArray(admins)) {
                    
                    throw new Error('Некорректный формат данных');
                }
                
                if (admins.length === 0) {
                    tbody.html('<tr><td colspan="7" class="text-center text-muted">Нет администраторов</td></tr>');
                    return;
                }
                
                admins.forEach(admin => {

                    const roleName = allRoles[admin.role]?.name || admin.role;
                    
                    const roleBadges = {
                        'admin': 'badge bg-danger',
                        'vospitatel': 'badge bg-primary',
                        'razmeshenie': 'badge bg-warning',
                        'super_admin': 'badge bg-dark',
                        'audit': 'badge bg-success'
                    };
                    

                    const safeFio = (admin.fio || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    const safeUsername = (admin.username || '').replace(/'/g, "\\'").replace(/"/g, '&quot;');
                    
                    const row = `
                        <tr>
                            <td>${admin.id}</td>
                            <td>${safeUsername}</td>
                            <td>${admin.fio || '-'}</td>
                            <td><span class="${roleBadges[admin.role] || 'badge bg-secondary'}">${roleName}</span></td>
                            <td>
                                <span class="badge ${admin.is_active ? 'bg-success' : 'bg-secondary'}">
                                    ${admin.is_active ? 'Активен' : 'Неактивен'}
                                </span>
                            </td>
                            <td>${admin.created_at ? new Date(admin.created_at).toLocaleDateString('ru-RU') : '-'}</td>
                            <td>
                                <button class="btn btn-sm btn-warning me-1" onclick="editAdmin(${admin.id}, '${safeUsername}', '${admin.role}', ${admin.is_active}, '${safeFio}')">
                                    <i class="bi bi-pencil"></i> Изменить
                                </button>
                                <button class="btn btn-sm btn-danger" onclick="deleteAdmin(${admin.id})" ${admin.id === currentAdminId ? 'disabled' : ''}>
                                    <i class="bi bi-trash"></i> Удалить
                                </button>
                            </td>
                        </tr>
                    `;
                    tbody.append(row);
                });
            } catch (error) {
                
                $('#adminsTableBody').html(`<tr><td colspan="7" class="text-center text-danger">Ошибка загрузки данных: ${error.message}</td></tr>`);
            }
        }


        async function getCurrentAdminId() {
            try {
                const response = await fetch('/api/user');
                if (response.ok) {
                    const data = await response.json();
                    if (data.admin_id) {
                        currentAdminId = data.admin_id;
                    }
                }
            } catch (e) {
                
            }
        }


        $('#submitAddAdminBtn').on('click', async function() {
            const username = $('#newAdminUsername').val().trim();
            const password = $('#newAdminPassword').val();
            const role = $('#newAdminRole').val();
            const fio = $('#newAdminFio').val().trim();
            
            if (!username || !password) {
                $('#addAdminStatus').html('<div class="alert alert-warning">Заполните все обязательные поля</div>');
                return;
            }
            
            if (password.length < 6) {
                $('#addAdminStatus').html('<div class="alert alert-warning">Пароль должен содержать минимум 6 символов</div>');
                return;
            }
            
            $('#submitAddAdminBtn').prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Добавление...');
            $('#addAdminStatus').html('');
            
            try {
                const response = await fetch('/api/admin/admins', {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({username, password, role, fio})
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    $('#addAdminStatus').html('<div class="alert alert-success">Администратор успешно добавлен</div>');
                    $('#addAdminForm')[0].reset();
                    setTimeout(() => {
                        $('#addAdminModal').modal('hide');
                        loadAdmins();
                    }, 1000);
                } else {
                    $('#addAdminStatus').html(`<div class="alert alert-danger">${data.error || 'Ошибка добавления'}</div>`);
                }
            } catch (error) {
                $('#addAdminStatus').html(`<div class="alert alert-danger">Ошибка: ${error.message}</div>`);
            } finally {
                $('#submitAddAdminBtn').prop('disabled', false).html('<i class="bi bi-check-circle"></i> Добавить');
            }
        });


        function editAdmin(id, username, role, isActive, fio) {
            $('#editAdminId').val(id);
            $('#editAdminUsername').val(username);
            $('#editAdminRole').val(role);
            $('#editAdminIsActive').prop('checked', isActive);
            $('#editAdminFio').val(fio || '');
            $('#editAdminPassword').val('');
            $('#editAdminStatus').html('');
            $('#editAdminModal').modal('show');
        }

        $('#submitEditAdminBtn').on('click', async function() {
            const id = parseInt($('#editAdminId').val());
            const role = $('#editAdminRole').val();
            const isActive = $('#editAdminIsActive').prop('checked');
            const password = $('#editAdminPassword').val().trim();
            const fio = $('#editAdminFio').val().trim();
            
            const updateData = {role, is_active: isActive, fio};
            if (password) {
                updateData.password = password;
            }
            
            $('#submitEditAdminBtn').prop('disabled', true).html('<span class="spinner-border spinner-border-sm"></span> Сохранение...');
            $('#editAdminStatus').html('');
            
            try {
                const response = await fetch(`/api/admin/admins/${id}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify(updateData)
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    $('#editAdminStatus').html('<div class="alert alert-success">Изменения сохранены</div>');
                    setTimeout(() => {
                        $('#editAdminModal').modal('hide');
                        loadAdmins();
                    }, 1000);
                } else {
                    $('#editAdminStatus').html(`<div class="alert alert-danger">${data.error || 'Ошибка сохранения'}</div>`);
                }
            } catch (error) {
                $('#editAdminStatus').html(`<div class="alert alert-danger">Ошибка: ${error.message}</div>`);
            } finally {
                $('#submitEditAdminBtn').prop('disabled', false).html('<i class="bi bi-check-circle"></i> Сохранить');
            }
        });


        async function deleteAdmin(id) {
            if (!confirm('Вы уверены, что хотите удалить этого администратора?')) {
                return;
            }
            
            try {
                const response = await fetch(`/api/admin/admins/${id}`, {
                    method: 'DELETE'
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    loadAdmins();
                } else {
                    alert(data.error || 'Ошибка удаления');
                }
            } catch (error) {
                alert('Ошибка: ' + error.message);
            }
        }


        $(document).ready(async function() {
            getCurrentAdminId();
            await loadRoles();
            loadAdmins();
        });
    </script>
    
    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
</html>
