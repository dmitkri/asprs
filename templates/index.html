<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>АСПиРС</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="/static/css/consta-datepicker.css">
    <link rel="stylesheet" href="/static/css/consta-dragndrop.css">
    <link rel="stylesheet" href="/static/css/consta-group-filter.css">
    <link rel="stylesheet" href="/static/css/consta-notifications.css">
    <link rel="stylesheet" href="/static/css/consta-button.css">
    <link rel="stylesheet" href="/static/css/consta-collapse.css">
    <link rel="stylesheet" href="/static/css/consta-combobox.css">
    <link rel="stylesheet" href="/static/css/rating-tooltip.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        /* Экран загрузки */
        .loading-screen {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 9999;
            transition: opacity 0.5s ease, visibility 0.5s ease;
        }
        
        .loading-screen.hidden {
            opacity: 0;
            visibility: hidden;
        }
        
        .loading-content {
            text-align: center;
        }
        
        .loading-content img {
            max-width: 1200px;
            width: 95%;
            height: auto;
            animation: pulse 1.5s ease-in-out infinite;
        }
        
        @keyframes pulse {
            0%, 100% {
                opacity: 1;
                transform: scale(1);
            }
            50% {
                opacity: 0.7;
                transform: scale(1.05);
            }
        }
    </style>
</head>
<body>
    
    <div class="loading-screen" id="loadingScreen">
        <div class="loading-content">
            <img src="{{ url_for('static', filename='aspeers.png') }}" alt="АСПиРС" />
        </div>
    </div>
    <div class="container mt-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div class="d-flex align-items-center gap-3">
                <img src="{{ url_for('static', filename='aspeers_max_w.svg') }}" alt="АСПиРС" style="width: 150px; height: 150px;" />
            </div>
            <a href="/admin" class="btn-login">Вход</a>
        </div>
        <div class="row g-2 mb-3 align-items-center">
            <div class="col-12">
                <input type="text" id="user_search" class="form-control" placeholder="Поиск по всем полям...">
            </div>
        </div>
        <div class="table-responsive">
            <table class="table table-hover table-striped" id="user_table">
                <thead class="table-dark">
                    <tr id="user_tableHead"></tr>
                </thead>
                <tbody id="user_tableBody"></tbody>
            </table>
        </div>
    </div>

    <div class="modal fade" id="user_empModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Карточка студента</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="user_modalBody"></div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>
                </div>
            </div>
        </div>
    </div>

    
    <script src="/static/js/utils.js"></script>
    <script src="/static/js/columns.js"></script>
    <script src="/static/js/groups.js"></script>
    <script src="/static/js/validation.js"></script>
    <script src="/static/js/employee.js"></script>
    <script src="/static/js/health.js"></script>
    <script src="/static/js/vacation.js"></script>
    <script src="/static/js/history.js"></script>
    <script src="/static/js/roommates.js"></script>
    <script src="/static/js/import.js"></script>
    <script src="/static/js/modals.js"></script>
    <script src="/static/js/init.js"></script>
    <script src="/static/js/main.js"></script>
    <script src="/static/js/consta-collapse.js"></script>
    <script src="/static/js/consta-combobox.js"></script>
    <script src="/static/script.js"></script>
    
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/l10n/ru.js"></script>
    <script src="/static/js/consta-datepicker.js"></script>
    
    <script src="/static/js/consta-dragndrop.js"></script>
    
    <script src="/static/js/consta-group-filter.js"></script>
    
    <script src="/static/js/consta-notifications.js"></script>
    <script>

        $(document).ready(function() {

            setTimeout(function() {
                $('#loadingScreen').addClass('hidden');
                setTimeout(function() {
                    $('#loadingScreen').remove();
                }, 500);
            }, 1000);
            

        });
    </script>
    
    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
</html>
