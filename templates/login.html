<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Вход в админку</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/consta-button.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        body.bg-light {
            display: flex;
            flex-direction: column;
            min-height: 100vh;
        }
        .login-container {
            flex: 1;
            display: flex;
            align-items: center;
            justify-content: center;
        }
        .btn-primary {
            background-color: rgb(12, 38, 119) !important;
            border-color: rgb(12, 38, 119) !important;
        }
        .btn-primary:hover {
            background-color: rgb(15, 48, 150) !important;
            border-color: rgb(15, 48, 150) !important;
        }
    </style>
</head>
<body class="bg-light">
    <div class="login-container">
        <div class="container">
            <div class="row justify-content-center">
                <div class="col-md-4">
                    <div class="text-center mb-4">
                        <img src="{{ url_for('static', filename='aspeers_max_w.svg') }}" alt="АСПиРС" style="max-width: 300px; width: 100%; height: auto;">
                    </div>
                    <div class="card">
                        <div class="card-body">
                            <h3 class="card-title text-center">Вход в систему</h3>
                            <form method="POST">
                                <div class="mb-3">
                                    <label class="form-label">Логин</label>
                                    <input type="text" name="username" class="form-control" required>
                                </div>
                                <div class="mb-3">
                                    <label class="form-label">Пароль</label>
                                    <input type="password" name="password" class="form-control" required>
                                </div>
                                <button type="submit" class="btn btn-primary w-100">Войти</button>
                            </form>
                            <div class="alert alert-info mt-3">
                                <small>Введите логин и пароль для входа в систему</small>
                            </div>
                            {% with messages = get_flashed_messages() %}
                                {% if messages %}
                                    <div class="alert alert-danger mt-3">{{ messages[0] }}</div>
                                {% endif %}
                            {% endwith %}
                            <hr>
                            <a href="/" class="btn btn-link w-100">Назад</a>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    
    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>
</body>
</html>
