<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/x-icon" href="/static/favicon.ico">
    <title>Заявки о поломках</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="https://code.jquery.com/jquery-3.7.1.min.js"></script>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&family=Rubik:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/static/css/consta-banner.css">
    <link rel="stylesheet" href="/static/css/design-system.css">
    <link rel="stylesheet" href="/static/style.css?v=5">
    <style>
        .request-card {
            border: 1px solid #e0e0e0;
            border-radius: 12px;
            margin-bottom: 20px;
            box-shadow: 0 2px 8px rgba(0,0,0,0.08);
            transition: all 0.3s ease;
            overflow: hidden;
        }
        .request-card:hover {
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            transform: translateY(-2px);
        }
        .request-card.status-new {
            border-left: 5px solid #0d6efd;
        }
        .request-card.status-in_progress {
            border-left: 5px solid #ffc107;
        }
        .request-card.status-closed {
            border-left: 5px solid #198754;
        }
        .request-header {
            padding: 20px;
            background: linear-gradient(135deg, #f8f9fa 0%, #ffffff 100%);
            border-bottom: 1px solid #e9ecef;
        }
        .request-title {
            font-size: 1.25rem;
            font-weight: 600;
            color: #212529;
            margin-bottom: 12px;
            line-height: 1.4;
        }
        .request-info {
            display: flex;
            flex-wrap: wrap;
            gap: 20px;
            margin-top: 12px;
        }
        .request-info-item {
            display: flex;
            align-items: center;
            gap: 8px;
            color: #6c757d;
            font-size: 0.9rem;
        }
        .request-info-item i {
            color: #0d6efd;
            font-size: 1rem;
        }
        .request-body {
            padding: 20px;
        }
        .status-badge {
            padding: 6px 14px;
            border-radius: 20px;
            font-size: 0.8rem;
            font-weight: 600;
            display: inline-block;
            margin-left: 12px;
        }
        .status-new {
            background-color: #e7f3ff;
            color: #0d6efd;
        }
        .status-in_progress {
            background-color: #fff3cd;
            color: #856404;
        }
        .status-closed {
            background-color: #d1e7dd;
            color: #0f5132;
        }
        .request-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-top: 16px;
            padding-top: 16px;
            border-top: 1px solid #e9ecef;
        }
        .request-date {
            color: #6c757d;
            font-size: 0.85rem;
        }
        .request-assignee {
            color: #6c757d;
            font-size: 0.85rem;
        }
    </style>
</head>
<body>
    <div class="top-menu-bar">
        <div class="top-menu-content">
            <a href="/admin" class="top-menu-item back-to-panel">
                <i class="bi bi-arrow-left"></i>
                <span>Назад в панель</span>
            </a>
            <h2 class="top-menu-title">Заявки о поломках</h2>
        </div>
    </div>
    
    <div class="container mt-4" style="margin-top: 80px !important;">
        <div class="mb-4">
            <p class="text-muted">Управление заявками студентов о поломках и неисправностях</p>
        </div>

        <div class="mb-3">
            <div class="btn-group" role="group">
                <button type="button" class="btn btn-outline-primary" onclick="filterRequests('')" id="filterAll">
                    Все
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="filterRequests('new')" id="filterNew">
                    Новые
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="filterRequests('in_progress')" id="filterInProgress">
                    В работе
                </button>
                <button type="button" class="btn btn-outline-primary" onclick="filterRequests('closed')" id="filterClosed">
                    Закрытые
                </button>
            </div>
        </div>

        <div class="row g-2 align-items-center mb-4">
            <div class="col-md-6">
                <input type="text" class="form-control" id="requestNumberSearch" placeholder="Поиск по номеру заявки..." oninput="handleRequestNumberSearch(this.value)">
            </div>
            <div class="col-md-6 text-md-end">
                <small class="text-muted">Введите полный номер заявки или ее часть</small>
            </div>
        </div>

        <div id="requestsList">
            <div class="text-center py-4">
                <div class="spinner-border" role="status">
                    <span class="visually-hidden">Загрузка...</span>
                </div>
            </div>
        </div>
    </div>

    <div class="modal fade" id="requestModal" tabindex="-1">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">Заявка <span id="modalRequestNumber"></span></h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal"></button>
                </div>
                <div class="modal-body" id="requestModalBody">
                </div>
                <div class="modal-footer" id="requestModalFooter">
                </div>
            </div>
        </div>
    </div>

    <footer class="page-footer">
        <div class="page-footer-text">АСПиРС - Российская разработка для ВУЗов и ССУЗов</div>
    </footer>

    <script src="/static/js/consta-banner.js"></script>
    <script>
        let currentStatusFilter = '';
        let currentRequestId = null;
        let currentRequestNumberSearch = '';
        let requestNumberSearchTimeout = null;


        async function loadRequests() {
            try {
                const params = new URLSearchParams();
                if (currentStatusFilter) {
                    params.append('status', currentStatusFilter);
                }
                if (currentRequestNumberSearch) {
                    params.append('request_number', currentRequestNumberSearch);
                }
                const url = params.toString() 
                    ? `/api/maintenance_requests?${params.toString()}`
                    : '/api/maintenance_requests';
                
                const response = await fetch(url, {
                    credentials: 'same-origin',
                    headers: {
                        'Accept': 'application/json',
                        'Content-Type': 'application/json'
                    }
                });
                
                const contentType = response.headers.get('content-type') || '';
                const isJson = contentType.includes('application/json');
                
                const responseClone = response.clone();
                
                if (!response.ok) {
                    if (isJson) {
                        try {
                            const errorData = await response.json();
                            throw new Error(errorData.error || `HTTP ${response.status}`);
                        } catch (e) {
                            if (e.message && (e.message.includes('JSON') || e.message.includes('Unexpected'))) {
                                const text = await responseClone.text();
                                throw new Error('Ошибка доступа. Пожалуйста, войдите в систему заново.');
                            }
                            throw e;
                        }
                    } else {
                        const text = await responseClone.text();
                        if (response.status === 401 || response.status === 403) {
                            throw new Error('Ошибка доступа. Пожалуйста, войдите в систему заново.');
                        } else {
                            throw new Error(`Ошибка сервера: ${response.status}`);
                        }
                    }
                }
                
                if (!isJson) {
                    const text = await responseClone.text();
                    throw new Error('Сервер вернул неверный формат данных');
                }
                
                let data;
                try {
                    data = await response.json();
                } catch (e) {
                    const text = await responseClone.text();
                    throw new Error('Ошибка при обработке ответа сервера');
                }
                
                const container = $('#requestsList');
                container.empty();
                
                if (data.success && data.requests) {
                    if (data.requests.length === 0) {
                        container.html('<div class="alert alert-info">Заявки не найдены</div>');
                        return;
                    }
                    
                    data.requests.forEach(req => {
                        const statusClass = `status-${req.status}`;
                        const statusText = {
                            'new': 'Новая',
                            'in_progress': 'В работе',
                            'closed': 'Закрыта'
                        }[req.status] || req.status;
                        
                        const room = [req.building, req.entrance, req.room_number].filter(Boolean).join('-') || 'не указана';
                        const createdDate = req.created_at_msk || req.created_at || '';
                        
                        let tgInfo = '<span class="text-muted">Не указан</span>';
                        if (req.tg_username) {
                            const username = req.tg_username.startsWith('@') ? req.tg_username : '@' + req.tg_username;
                            tgInfo = `<a href="https://t.me/${req.tg_username.replace('@', '')}" target="_blank" class="text-decoration-none">
                                <i class="bi bi-telegram"></i> ${escapeHtml(username)}
                            </a>`;
                        } else if (req.tg_user_id) {
                            tgInfo = `<span><i class="bi bi-telegram"></i> ID: ${req.tg_user_id}</span>`;
                        }
                        
                        let cardHtml = `
                            <div class="request-card ${statusClass}" onclick="viewRequest(${req.id})" style="cursor: pointer;">
                                <div class="request-header">
                                    <div class="request-title">
                                        ${escapeHtml(req.message.length > 150 ? req.message.substring(0, 150) + '...' : req.message)}
                                        <span class="status-badge ${statusClass}">${statusText}</span>
                                    </div>
                                    <div class="request-info">
                                        <div class="request-info-item">
                                            <i class="bi bi-person"></i>
                                            <span><strong>${escapeHtml(req.student_fio || 'Не указано')}</strong></span>
                                        </div>
                                        <div class="request-info-item">
                                            <i class="bi bi-door-open"></i>
                                            <span>${escapeHtml(room)}</span>
                                        </div>
                                        <div class="request-info-item">
                                            ${tgInfo}
                                        </div>
                                    </div>
                                </div>
                                <div class="request-body">
                                    <div class="request-meta">
                                        <div class="request-date">
                                            <i class="bi bi-clock"></i> ${escapeHtml(createdDate)}
                                            ${req.request_number ? ` • <code>${escapeHtml(req.request_number)}</code>` : ''}
                                        </div>
                                        ${req.assigned_admin_fio ? `<div class="request-assignee"><i class="bi bi-person-check"></i> ${escapeHtml(req.assigned_admin_fio)}</div>` : ''}
                                    </div>
                                </div>
                            </div>
                        `;
                        container.append(cardHtml);
                    });
                }
            } catch (error) {
                
                $('#requestsList').html('<div class="alert alert-danger">Ошибка загрузки данных</div>');
            }
        }

        function filterRequests(status) {
            currentStatusFilter = status;
            
            $('.btn-group button').removeClass('active');
            if (status === '') {
                $('#filterAll').addClass('active');
            } else if (status === 'new') {
                $('#filterNew').addClass('active');
            } else if (status === 'in_progress') {
                $('#filterInProgress').addClass('active');
            } else if (status === 'closed') {
                $('#filterClosed').addClass('active');
            }
            
            loadRequests();
        }

        function handleRequestNumberSearch(value) {
            currentRequestNumberSearch = value.trim();
            if (requestNumberSearchTimeout) {
                clearTimeout(requestNumberSearchTimeout);
            }
            requestNumberSearchTimeout = setTimeout(() => loadRequests(), 300);
        }

        async function viewRequest(requestId) {
            currentRequestId = requestId;
            
            try {
                const response = await fetch('/api/maintenance_requests');
                const data = await response.json();
                
                if (data.success && data.requests) {
                    const req = data.requests.find(r => r.id === requestId);
                    if (!req) {
                        if (typeof showBannerError !== 'undefined') {
                            showBannerError('Заявка не найдена');
                        } else {
                            alert('Заявка не найдена');
                        }
                        return;
                    }
                    
                    const statusText = {
                        'new': 'Новая',
                        'in_progress': 'В работе',
                        'closed': 'Закрыта'
                    }[req.status] || req.status;
                    
                    const room = [req.building, req.entrance, req.room_number].filter(Boolean).join('-') || 'не указана';
                    const createdDate = req.created_at_msk || req.created_at || '';
                    const assignedDate = req.assigned_at_msk || req.assigned_at || '';
                    const closedDate = req.closed_at_msk || req.closed_at || '';
                    
                    let bodyHtml = `
                        <div class="mb-3">
                            <p><strong>Статус:</strong> <span class="status-badge status-${req.status}">${statusText}</span></p>
                            <p><strong>Студент:</strong> ${escapeHtml(req.student_fio)}</p>
                            <p><strong>Комната:</strong> ${escapeHtml(room)}</p>
                            <p><strong>Создана:</strong> ${escapeHtml(createdDate)}</p>
                            ${req.request_number ? `<p><strong>Номер заявки:</strong> <code>${escapeHtml(req.request_number)}</code></p>` : ''}
                            ${req.assigned_admin_fio ? `<p><strong>Исполнитель:</strong> ${escapeHtml(req.assigned_admin_fio)}</p>` : ''}
                            ${assignedDate ? `<p><strong>Взята в работу:</strong> ${escapeHtml(assignedDate)}</p>` : ''}
                            ${closedDate ? `<p><strong>Закрыта:</strong> ${escapeHtml(closedDate)}</p>` : ''}
                        </div>
                        <div class="mb-3">
                            <strong>Сообщение:</strong>
                            <div class="alert alert-light">${escapeHtml(req.message).replace(/\n/g, '<br>')}</div>
                        </div>
                    `;
                    
                    if (req.admin_comment) {
                        bodyHtml += `
                            <div class="mb-3">
                                <strong>Комментарии администратора:</strong>
                                <div class="alert alert-info">${escapeHtml(req.admin_comment).replace(/\n/g, '<br>')}</div>
                            </div>
                        `;
                    }
                    
                    if (req.status === 'new') {
                        bodyHtml += `
                            <div class="mb-3">
                                <label for="requestNumber" class="form-label">Номер заявки (необязательно, будет сгенерирован автоматически)</label>
                                <input type="text" class="form-control" id="requestNumber" placeholder="REQ-YYYYMMDD-XXX">
                            </div>
                            <div class="mb-3">
                                <label for="adminComment" class="form-label">Комментарий или уточняющий вопрос</label>
                                <textarea class="form-control" id="adminComment" rows="3" placeholder="Введите комментарий..."></textarea>
                            </div>
                        `;
                    } else if (req.status === 'in_progress') {
                        bodyHtml += `
                            <div class="mb-3">
                                <label for="adminComment" class="form-label">Добавить комментарий</label>
                                <textarea class="form-control" id="adminComment" rows="3" placeholder="Введите комментарий..."></textarea>
                            </div>
                        `;
                    }
                    
                    $('#modalRequestNumber').text(req.request_number || `#${req.id}`);
                    $('#requestModalBody').html(bodyHtml);
                    
                    let footerHtml = '';
                    if (req.status === 'new') {
                        footerHtml = `
                            <button type="button" class="btn btn-primary" onclick="assignRequest(${req.id})">
                                <i class="bi bi-check-circle"></i> Взять в работу
                            </button>
                        `;
                    } else if (req.status === 'in_progress') {
                        footerHtml = `
                            <button type="button" class="btn btn-info" onclick="addComment(${req.id})">
                                <i class="bi bi-chat"></i> Добавить комментарий
                            </button>
                            <button type="button" class="btn btn-success" onclick="closeRequest(${req.id})">
                                <i class="bi bi-check-circle"></i> Закрыть заявку
                            </button>
                        `;
                    }
                    footerHtml += '<button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Закрыть</button>';
                    $('#requestModalFooter').html(footerHtml);
                    
                    $('#requestModal').modal('show');
                }
            } catch (error) {
                
                if (typeof showBannerError !== 'undefined') {
                    showBannerError('Ошибка загрузки заявки');
                } else {
                    alert('Ошибка загрузки заявки');
                }
            }
        }

        async function assignRequest(requestId) {
            const requestNumber = $('#requestNumber').val().trim();
            const comment = $('#adminComment').val().trim();
            
            try {
                const response = await fetch(`/api/maintenance_requests/${requestId}/assign`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        request_number: requestNumber,
                        comment: comment
                    })
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    $('#requestModal').modal('hide');
                    loadRequests();
                    if (typeof showBannerSuccess !== 'undefined') {
                        showBannerSuccess('Заявка взята в работу');
                    }
                } else {
                    const errorMsg = data.error || `Ошибка сервера: ${response.status}`;
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError('Ошибка: ' + errorMsg);
                    } else {
                        alert('Ошибка: ' + errorMsg);
                    }
                    
                }
            } catch (error) {
                if (typeof showBannerError !== 'undefined') {
                    showBannerError('Ошибка: ' + error.message);
                } else {
                    alert('Ошибка: ' + error.message);
                }
                
            }
        }


        async function addComment(requestId) {
            const comment = $('#adminComment').val().trim();
            
            if (!comment) {
                if (typeof showBannerWarning !== 'undefined') {
                    showBannerWarning('Введите комментарий');
                } else {
                    alert('Введите комментарий');
                }
                return;
            }
            
            try {
                const response = await fetch(`/api/maintenance_requests/${requestId}/comment`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({comment: comment})
                });
                
                const data = await response.json();
                
                if (response.ok && data.success) {
                    $('#adminComment').val('');
                    viewRequest(requestId);
                    loadRequests();
                    if (typeof showBannerSuccess !== 'undefined') {
                        showBannerSuccess('Комментарий добавлен');
                    }
                } else {
                    if (typeof showBannerError !== 'undefined') {
                        showBannerError('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                    } else {
                        alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                    }
                }
            } catch (error) {
                if (typeof showBannerError !== 'undefined') {
                    showBannerError('Ошибка: ' + error.message);
                } else {
                    alert('Ошибка: ' + error.message);
                }
            }
        }


        async function closeRequest(requestId) {
            if (typeof showBannerConfirm !== 'undefined') {
                showBannerConfirm(
                    'Вы уверены, что хотите закрыть эту заявку?',
                    async () => {

                        try {
                            const response = await fetch(`/api/maintenance_requests/${requestId}/close`, {
                                method: 'POST'
                            });
                            
                            const data = await response.json();
                            
                            if (response.ok && data.success) {
                                $('#requestModal').modal('hide');
                                loadRequests();
                                if (typeof showBannerSuccess !== 'undefined') {
                                    showBannerSuccess('Заявка закрыта');
                                }
                            } else {
                                if (typeof showBannerError !== 'undefined') {
                                    showBannerError('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                                } else {
                                    alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                                }
                            }
                        } catch (error) {
                            if (typeof showBannerError !== 'undefined') {
                                showBannerError('Ошибка: ' + error.message);
                            } else {
                                alert('Ошибка: ' + error.message);
                            }
                        }
                    },
                    () => {

                    }
                );
            } else {

                if (!confirm('Вы уверены, что хотите закрыть эту заявку?')) {
                    return;
                }
                
                try {
                    const response = await fetch(`/api/maintenance_requests/${requestId}/close`, {
                        method: 'POST'
                    });
                    
                    const data = await response.json();
                    
                    if (response.ok && data.success) {
                        $('#requestModal').modal('hide');
                        loadRequests();
                    } else {
                        alert('Ошибка: ' + (data.error || 'Неизвестная ошибка'));
                    }
                } catch (error) {
                    alert('Ошибка: ' + error.message);
                }
            }
        }

        function escapeHtml(text) {
            const div = document.createElement('div');
            div.textContent = text;
            return div.innerHTML;
        }


        $(document).ready(function() {
            filterRequests('');
        });
    </script>
</body>
</html>
